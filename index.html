<!DOCTYPE html>
<html lang="en">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>House Painting Tracker</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f0f4f8; color: #222; min-height: 100vh; }

  /* Header */
  header { background: #1f4f7b; color: #fff; padding: 16px 20px 0; }
  header h1 { font-size: 1.35rem; font-weight: 700; letter-spacing: 0.02em; }
  header p.subtitle { font-size: 0.82rem; opacity: 0.78; margin-top: 2px; }

  /* View Tabs */
  .view-tabs { display: flex; margin-top: 14px; }
  .view-tab { flex: 1; padding: 10px 0; font-size: 0.88rem; font-weight: 600;
    text-align: center; background: rgba(255,255,255,0.15); color: rgba(255,255,255,0.75);
    border: none; cursor: pointer; transition: background 0.18s, color 0.18s;
    border-radius: 8px 8px 0 0; }
  .view-tab.active { background: #fff; color: #1f4f7b; }
  .view-tab:hover:not(.active) { background: rgba(255,255,255,0.25); color: #fff; }

  /* Weather */
  #weather-section { padding: 12px 16px; background: #e8f0fa; border-bottom: 1px solid #c8d8ec; }
  #weather-section h2 { font-size: 0.78rem; font-weight: 700; color: #1f4f7b; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 8px; }
  #weather-cards { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; }
  .weather-card { min-width: 72px; background: #fff; border-radius: 10px; padding: 8px 6px;
    text-align: center; box-shadow: 0 1px 4px rgba(0,0,0,0.08); flex-shrink: 0; }
  .weather-card .wday { font-size: 0.7rem; font-weight: 700; color: #555; text-transform: uppercase; }
  .weather-card .wicon { font-size: 1.5rem; line-height: 1.4; }
  .weather-card .wtemp { font-size: 0.82rem; font-weight: 600; color: #1f4f7b; }
  .weather-card .wdesc { font-size: 0.65rem; color: #777; margin-top: 2px; }

  /* Filter Bar */
  #filter-bar { padding: 10px 12px; display: flex; gap: 7px; flex-wrap: wrap; background: #fff; border-bottom: 1px solid #e2e8f0; }
  .filter-btn { padding: 5px 14px; border-radius: 20px; border: 2px solid #1f4f7b;
    background: #fff; color: #1f4f7b; font-size: 0.8rem; font-weight: 600; cursor: pointer; transition: all 0.15s; }
  .filter-btn.active, .filter-btn:hover { background: #1f4f7b; color: #fff; }
  #list-count { margin-left: auto; font-size: 0.78rem; color: #777; align-self: center; padding-right: 4px; }

  /* House Cards */
  #house-list { padding: 12px; display: grid; gap: 10px; }
  .house-card { background: #fff; border-radius: 12px; padding: 14px 16px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.07); cursor: pointer; transition: box-shadow 0.15s, transform 0.1s;
    border-left: 5px solid #ccc; display: flex; align-items: center; gap: 12px; }
  .house-card:hover { box-shadow: 0 4px 14px rgba(0,0,0,0.13); transform: translateY(-1px); }
  .house-card.status-not-started { border-left-color: #94a3b8; }
  .house-card.status-in-progress { border-left-color: #f59e0b; }
  .house-card.status-completed { border-left-color: #22c55e; }
  .card-icon { font-size: 1.6rem; flex-shrink: 0; }
  .card-body { flex: 1; min-width: 0; }
  .card-address { font-weight: 700; font-size: 0.95rem; color: #1a1a1a; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card-street { font-size: 0.78rem; color: #555; }
  .status-pill { display: inline-block; padding: 2px 10px; border-radius: 12px; font-size: 0.72rem;
    font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; margin-top: 4px; }
  .status-pill.not-started { background: #f1f5f9; color: #64748b; }
  .status-pill.in-progress { background: #fef3c7; color: #92400e; }
  .status-pill.completed { background: #dcfce7; color: #166534; }

  /* Detail Overlay */
  #detail-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.55);
    z-index: 1000; align-items: flex-end; justify-content: center; }
  #detail-overlay.open { display: flex; }
  .detail-card { background: #fff; border-radius: 20px 20px 0 0; padding: 24px 20px 36px;
    width: 100%; max-width: 520px; max-height: 88vh; overflow-y: auto;
    box-shadow: 0 -4px 24px rgba(0,0,0,0.18); animation: slideUp 0.22s ease; }
  @keyframes slideUp { from { transform: translateY(60px); opacity:0; } to { transform:translateY(0); opacity:1; } }
  .detail-card h2 { font-size: 1.1rem; font-weight: 700; color: #1f4f7b; margin-bottom: 4px; }
  .detail-card .detail-subtitle { font-size: 0.8rem; color: #666; margin-bottom: 16px; }
  .detail-field { margin-bottom: 14px; }
  .detail-field label { display: block; font-size: 0.78rem; font-weight: 700; color: #444;
    text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 5px; }
  .detail-field select, .detail-field textarea { width: 100%; border: 1.5px solid #d1d5db;
    border-radius: 8px; padding: 9px 12px; font-size: 0.9rem; font-family: inherit;
    background: #f9fafb; color: #111; transition: border-color 0.15s; resize: vertical; }
  .detail-field select:focus, .detail-field textarea:focus { outline: none; border-color: #1f4f7b; background: #fff; }
  .detail-actions { display: flex; gap: 10px; margin-top: 18px; flex-wrap: wrap; }
  .btn { padding: 10px 20px; border-radius: 10px; border: none; font-size: 0.9rem;
    font-weight: 700; cursor: pointer; transition: background 0.15s, transform 0.1s; }
  .btn:active { transform: scale(0.97); }
  .btn-primary { background: #1f4f7b; color: #fff; flex: 1; }
  .btn-primary:hover { background: #174069; }
  .btn-success { background: #22c55e; color: #fff; }
  .btn-success:hover { background: #16a34a; }
  .btn-close { background: #f1f5f9; color: #555; }
  .btn-close:hover { background: #e2e8f0; }
  .detail-meta { font-size: 0.75rem; color: #999; margin-top: 12px; }

  /* Map View */
  #map-view { display: none; }
  #map-view.active-view { display: block; }
  #list-view.hidden-view { display: none; }
  .map-instructions { padding: 8px 16px; background: #e8f0fa; font-size: 0.78rem;
    color: #1f4f7b; text-align: center; font-weight: 500; border-bottom: 1px solid #c8d8ec; }
  .map-container { position: relative; width: 100%; overflow: hidden; }
  .map-container img.map-bg { width: 100%; height: auto; display: block; }
  .map-hotspot { position: absolute; transform: translate(-50%, -50%);
    width: 16px; height: 16px; border-radius: 50%;
    border: 2px solid rgba(255,255,255,0.9); cursor: pointer;
    transition: transform 0.12s, box-shadow 0.12s;
    box-shadow: 0 1px 4px rgba(0,0,0,0.4); z-index: 10;
    background: none; padding: 0; }
  .map-hotspot:hover { transform: translate(-50%, -50%) scale(1.7);
    box-shadow: 0 3px 10px rgba(0,0,0,0.5); z-index: 20; }
  .map-hotspot.status-not-started { background: #94a3b8; }
  .map-hotspot.status-in-progress { background: #f59e0b; }
  .map-hotspot.status-completed { background: #22c55e; }
  .map-hotspot::after { content: attr(data-label);
    position: absolute; bottom: 130%; left: 50%; transform: translateX(-50%);
    background: rgba(15,23,42,0.88); color: #fff; font-size: 0.63rem; font-weight: 600;
    white-space: nowrap; padding: 3px 7px; border-radius: 5px;
    pointer-events: none; opacity: 0; transition: opacity 0.15s; z-index: 30; }
  .map-hotspot:hover::after { opacity: 1; }
  .map-legend { display: flex; gap: 18px; padding: 10px 16px; background: #fff;
    border-top: 1px solid #e2e8f0; flex-wrap: wrap; }
  .legend-item { display: flex; align-items: center; gap: 6px; font-size: 0.78rem; color: #555; font-weight: 600; }
  .legend-dot { width: 13px; height: 13px; border-radius: 50%; border: 2px solid rgba(0,0,0,0.12); flex-shrink:0; }
  .legend-dot.not-started { background: #94a3b8; }
  .legend-dot.in-progress { background: #f59e0b; }
  .legend-dot.completed { background: #22c55e; }
  .map-stats { padding: 8px 16px; background: #fff; border-top: 1px solid #f0f4f8;
    font-size: 0.78rem; color: #777; display: flex; gap: 12px; flex-wrap: wrap; }
  .map-stat-val { font-weight: 700; color: #1f4f7b; }

  @media (min-width: 600px) {

  }
</style>
</head>

<header>
  <h1>&#127968; House Painting Tracker</h1>
  <p class="subtitle">Lafayette, IN &middot; Summer painting plan</p>
  <div class="view-tabs">
    <button class="view-tab active" id="tab-list" onclick="switchView('list')">&#128203; List View</button>
    <button class="view-tab" id="tab-map" onclick="switchView('map')">&#128506; Map View</button>
  </div>
</header>

<div id="weather-section">
  <h2>&#9728;&#65039; 5-Day Forecast &#8212; Lafayette, IN</h2>
  <div id="weather-cards"><span style="font-size:0.8rem;color:#999">Loading weather&hellip;</span></div>
</div>

<div id="list-view">
  <div id="filter-bar">
    <button class="filter-btn active" onclick="setFilter('all',this)">All</button>
    <button class="filter-btn" onclick="setFilter('not-started',this)">Not Started</button>
    <button class="filter-btn" onclick="setFilter('in-progress',this)">In Progress</button>
    <button class="filter-btn" onclick="setFilter('completed',this)">Completed</button>
    <span id="list-count"></span>
  </div>
  <div id="house-list"></div>
</div>

<div id="map-view">
  <div class="map-instructions">Tap any dot to open house details &nbsp;&middot;&nbsp; Pinch/scroll to zoom</div>
  <div class="map-container" id="map-container">
    <img class="map-bg" id="map-img" alt="Amelia Station Neighborhood Map" src="map.png" />
  </div>
  <div class="map-legend">
    <div class="legend-item"><div class="legend-dot not-started"></div>Not Started</div>
    <div class="legend-item"><div class="legend-dot in-progress"></div>In Progress</div>
    <div class="legend-item"><div class="legend-dot completed"></div>Completed</div>
  </div>
  <div class="map-stats" id="map-stats"></div>
</div>

<div id="detail-overlay" role="dialog" aria-modal="true">
  <div class="detail-card">
    <h2 id="detail-address">Address</h2>
    <div class="detail-subtitle" id="detail-city-state"></div>
    <div class="detail-field">
      <label for="detail-status">Status</label>
      <select id="detail-status">
        <option value="not-started">Not Started</option>
        <option value="in-progress">In Progress</option>
        <option value="completed">Completed</option>
      </select>
    </div>
    <div class="detail-field">
      <label for="detail-notes">Notes</label>
      <textarea id="detail-notes" rows="3" placeholder="Paint color, prep notes, contact info&hellip;"></textarea>
    </div>
    <div class="detail-field">
      <label for="detail-photo">Photo Notes</label>
      <textarea id="detail-photo" rows="2" placeholder="Before/after photo filenames or links&hellip;"></textarea>
    </div>
    <div class="detail-meta" id="detail-updated"></div>
    <div class="detail-actions">
      <button class="btn btn-primary" onclick="saveDetail()">&#128190; Save</button>
      <button class="btn btn-success" onclick="markCompleted()">&#9989; Mark Completed</button>
      <button class="btn btn-close" onclick="closeDetail()">&#10005; Close</button>
    </div>
  </div>
</div>

function loadHouseData() {
  try {
    var raw = localStorage.getItem(STORAGE_KEY);
    if (raw) houseData = JSON.parse(raw);
  } catch(e) { houseData = {}; }
  baseHouses.forEach(function(h) {
    if (!houseData[h.id]) {
      houseData[h.id] = {status:'not-started',notes:'',photoNotes:'',updatedAt:null};

  });
}

function saveHouseData(data) {
  houseData = data;
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(houseData)); } catch(e) {}

  return {'not-started':'&#127968;','in-progress':'&#127912;','completed':'&#9989;'}[s] || '&#127968;';
}

function switchView(view) {
  var listEl = document.getElementById('list-view');
  var mapEl  = document.getElementById('map-view');
  var tabL   = document.getElementById('tab-list');
  var tabM   = document.getElementById('tab-map');
  if (view === 'map') {
    listEl.classList.add('hidden-view');
    mapEl.classList.add('active-view');
    tabL.classList.remove('active');
    tabM.classList.add('active');
    renderMapHotspots();
  } else {
    mapEl.classList.remove('active-view');
    listEl.classList.remove('hidden-view');
    tabL.classList.add('active');
    tabM.classList.remove('active');
  }
}

function setFilter(filter, btn) {
  currentFilter = filter;
  document.querySelectorAll('.filter-btn').forEach(function(b){ b.classList.remove('active'); });
  btn.classList.add('active');
  renderHouseList();
}

function renderHouseList() {
  var container = document.getElementById('house-list');
  var filtered = baseHouses.filter(function(h) {
    if (currentFilter === 'all') return true;
    return (houseData[h.id] && houseData[h.id].status || 'not-started') === currentFilter;
  });
  document.getElementById('list-count').textContent = filtered.length + ' / ' + baseHouses.length + ' houses';
  container.innerHTML = filtered.map(function(h) {
    var d = houseData[h.id] || {};
    var st = d.status || 'not-started';
    var sc = statusClass(st);
    return '<div class="house-card status-' + sc + '" onclick="openDetail('' + h.id.replace(/'/g,"\'") + '')">'
      + '<div class="card-icon">' + statusIcon(st) + '</div>'
      + '<div class="card-body">'
      + '<div class="card-address">' + h.number + ' ' + h.street + '</div>'
      + '<div class="card-street">' + h.city + ', ' + h.state + '</div>'
      + '<span class="status-pill ' + sc + '">' + statusLabel(st) + '</span>'
      + '</div></div>';
  }).join('');
}

function renderMapHotspots() {
  var container = document.getElementById('map-container');
  var old = container.querySelectorAll('.map-hotspot');
  old.forEach(function(el){ el.remove(); });
  var counts = {'not-started':0,'in-progress':0,'completed':0};
  MAP_HOTSPOTS.forEach(function(hs) {
    var d = houseData[hs.id] || {};
    var st = d.status || 'not-started';
    var sc = statusClass(st);
    counts[sc]++;
    var parts = hs.id.split(' ');
    var num = parts[0];
    var street = parts.slice(1).join(' ').replace(' Court','Ct').replace(' Lane','Ln');
    var el = document.createElement('button');
    el.className = 'map-hotspot status-' + sc;
    el.style.left = hs.x + '%';
    el.style.top  = hs.y + '%';
    el.setAttribute('data-label', num + ' ' + street);
    el.setAttribute('aria-label', hs.id + ' – ' + statusLabel(st));
    el.setAttribute('title', hs.id + ' (' + statusLabel(st) + ')');
    (function(id){ el.addEventListener('click', function(){ openDetail(id); }); })(hs.id);
    container.appendChild(el);
  });
  var statsEl = document.getElementById('map-stats');
  if (statsEl) {
    statsEl.innerHTML =
      '<span>&#128203; <span class="map-stat-val">' + baseHouses.length + '</span> total houses</span>' +
      '<span>&#128308; <span class="map-stat-val">' + counts['not-started'] + '</span> not started</span>' +
      '<span>&#128993; <span class="map-stat-val">' + counts['in-progress'] + '</span> in progress</span>' +
      '<span>&#128994; <span class="map-stat-val">' + counts['completed'] + '</span> completed</span>';
  }
}

function openDetail(id) {
  var house = null;
  for (var i = 0; i < baseHouses.length; i++) {
    if (baseHouses[i].id === id) { house = baseHouses[i]; break; }
  }
  if (!house) return;
  var d = houseData[id] || {status:'not-started',notes:'',photoNotes:'',updatedAt:null};
  currentDetailId = id;
  document.getElementById('detail-address').textContent = house.number + ' ' + house.street;
  document.getElementById('detail-city-state').textContent = house.city + ', ' + house.state;
  document.getElementById('detail-status').value = d.status || 'not-started';
  document.getElementById('detail-notes').value  = d.notes || '';
  document.getElementById('detail-photo').value  = d.photoNotes || '';
  document.getElementById('detail-updated').textContent =
    d.updatedAt ? 'Last updated: ' + new Date(d.updatedAt).toLocaleString() : '';
  document.getElementById('detail-overlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeDetail() {
  document.getElementById('detail-overlay').classList.remove('open');
  document.body.style.overflow = '';
  currentDetailId = null;
}

function saveDetail() {
  if (!currentDetailId) return;
  if (!houseData[currentDetailId]) houseData[currentDetailId] = {};
  houseData[currentDetailId].status     = document.getElementById('detail-status').value;
  houseData[currentDetailId].notes      = document.getElementById('detail-notes').value;
  houseData[currentDetailId].photoNotes = document.getElementById('detail-photo').value;
  houseData[currentDetailId].updatedAt  = new Date().toISOString();
  saveHouseData(houseData);
  renderHouseList();
  renderMapHotspots();
  closeDetail();
}

function markCompleted() {
  if (!currentDetailId) return;
  document.getElementById('detail-status').value = 'completed';
  saveDetail();
}

document.getElementById('detail-overlay').addEventListener('click', function(e) {
  if (e.target === this) closeDetail();
});

function fetchWeather() {
  var API_KEY = '33d67245406dbd31d48ce777640c12e7';
  var CITY    = 'Lafayette,US';
  var url = 'https://api.openweathermap.org/data/2.5/forecast?q=' + CITY + '&appid=' + API_KEY + '&units=imperial&cnt=40';
  fetch(url).then(function(r){ return r.json(); }).then(function(data) {
    if (!data.list) return;
    var days = {};
    data.list.forEach(function(item) {
      var date = item.dt_txt.split(' ')[0];
      if (!days[date]) days[date] = [];
      days[date].push(item);
    });
    var container = document.getElementById('weather-cards');
    var dayKeys = Object.keys(days).slice(0,5);
    var icons = {Clear:'&#9728;&#65039;',Clouds:'&#9925;',Rain:'&#127783;&#65039;',
      Drizzle:'&#127782;&#65039;',Thunderstorm:'&#9928;&#65039;',Snow:'&#10052;&#65039;',
      Mist:'&#127787;&#65039;',Fog:'&#127787;&#65039;',Haze:'&#127787;&#65039;'};
    container.innerHTML = dayKeys.map(function(date) {
      var items = days[date];
      var avgTemp = Math.round(items.reduce(function(s,i){ return s + i.main.temp; },0) / items.length);
      var mid = items[Math.floor(items.length/2)];
      var main = mid.weather[0].main;
      var desc = mid.weather[0].description;
      var icon = icons[main] || '&#127780;&#65039;';
      var dayName = new Date(date + 'T12:00:00').toLocaleDateString('en-US',{weekday:'short'});
      return '<div class="weather-card">'
        + '<div class="wday">' + dayName + '</div>'
        + '<div class="wicon">' + icon + '</div>'
        + '<div class="wtemp">' + avgTemp + '&deg;F</div>'
        + '<div class="wdesc">' + desc + '</div>'
        + '</div>';
    }).join('');
  }).catch(function() {
    document.getElementById('weather-cards').innerHTML =
      '<span style="font-size:0.8rem;color:#999">Weather unavailable</span>';
  });
}

loadHouseData();
renderHouseList();
fetchWeather();
</script>

</html>
